name: Scopri Paese Runner

# Trigger manuale o push su main
on:
  workflow_dispatch:   # permette di lanciare manualmente il workflow
  push:
    branches:
      - main

jobs:
  get-runner-location:
    runs-on: ubuntu-latest
    steps:
      - name: Ricava IP pubblico
        id: ip
        run: |
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "IP pubblico: $PUBLIC_IP"
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Geolocalizza IP
        run: |
          COUNTRY=$(curl -s https://ipapi.co/$PUBLIC_IP/json/ | jq -r '.country_name')
          echo "Il runner GitHub Actions si trova in: $COUNTRY"
